apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: messaging}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: messaging}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmqImage }}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: banking}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: rabbitmq-auth, key: password}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 20
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.storageSize }}}

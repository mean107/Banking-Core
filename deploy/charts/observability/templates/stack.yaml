apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: "discovery.kubernetes \"pods\" { role = \"pod\" }\ndiscovery.relabel\
    \ \"banking\" {\n  targets = discovery.kubernetes.pods.targets\n  rule {\n   \
    \ source_labels = [\"__meta_kubernetes_namespace\"]\n    regex = \"banking\"\n\
    \    action = \"keep\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_label_app\"\
    ]\n    target_label = \"service\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"\
    ]\n    target_label = \"pod\"\n  }\n}\nloki.source.kubernetes \"pods\" {\n  targets\
    \ = discovery.relabel.banking.output\n  forward_to = [loki.write.local.receiver]\n\
    }\nloki.write \"local\" {\n  endpoint { url = \"http://loki:3100/loki/api/v1/push\"\
    \ }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      containers:
      - name: alloy
        image: grafana/alloy:v1.8.1
        ports:
        - containerPort: 12345
          name: p12345
        volumeMounts:
        - name: config
          mountPath: /etc/banking
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        args:
        - run
        - /etc/banking/config.alloy
        - --storage.path=/tmp/alloy
      volumes:
      - name: config
        configMap:
          name: alloy-config
      securityContext:
        fsGroup: 0
      serviceAccountName: banking-observer
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    app: alloy
  ports:
  - port: 12345
    targetPort: 12345
    name: p12345
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: observability
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    url: http://prometheus:9090\n    isDefault: true\n\
    \  - name: Loki\n    uid: loki\n    type: loki\n    url: http://loki:3100\n  -\
    \ name: Tempo\n    uid: tempo\n    type: tempo\n    url: http://tempo:3200\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n  - name: banking\n    type: file\n\
    \    options: {path: /var/lib/grafana/dashboards}\n"
  banking.json: '{"uid": "banking-core", "title": "Banking Core Operations", "schemaVersion":
    39, "version": 1, "refresh": "10s", "time": {"from": "now-30m", "to": "now"},
    "panels": [{"id": 1, "type": "timeseries", "title": "API requests per second",
    "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0,
    "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "sum(rate(banking_http_requests_total[1m]))",
    "refId": "A", "legendFormat": "auto"}], "fieldConfig": {"defaults": {"unit": "reqps"}}},
    {"id": 2, "type": "timeseries", "title": "P95 API latency", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 12, "h":
    8}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(banking_http_duration_seconds_bucket[5m])))",
    "refId": "A", "legendFormat": "auto"}], "fieldConfig": {"defaults": {"unit": "s"}}},
    {"id": 3, "type": "timeseries", "title": "5xx ratio", "datasource": {"type": "prometheus",
    "uid": "prometheus"}, "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}, "targets":
    [{"expr": "sum(rate(banking_http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(banking_http_requests_total[5m])),
    0.001)", "refId": "A", "legendFormat": "auto"}], "fieldConfig": {"defaults": {"unit":
    "percentunit"}}}, {"id": 4, "type": "timeseries", "title": "Consumer throughput
    by role", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos":
    {"x": 12, "y": 8, "w": 12, "h": 8}, "targets": [{"expr": "sum by (role) (rate(banking_messages_total[1m]))",
    "refId": "A", "legendFormat": "auto"}], "fieldConfig": {"defaults": {"unit": "ops"}}}]}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.6.0
        ports:
        - containerPort: 3000
          name: p3000
        volumeMounts:
        - name: config
          mountPath: /etc/banking
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
        - name: config
          subPath: datasources.yaml
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
        - name: config
          subPath: dashboards.yaml
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
        - name: config
          subPath: banking.json
          mountPath: /var/lib/grafana/dashboards/banking.json
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-auth
              key: password
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
      volumes:
      - name: config
        configMap:
          name: grafana-config
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      securityContext:
        fsGroup: 472
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    name: p3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-observer
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banking-observer
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: banking-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: banking-observer
subjects:
- kind: ServiceAccount
  name: banking-observer
  namespace: observability

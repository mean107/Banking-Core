apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yaml: "global:\n  scrape_interval: 10s\nrule_files:\n- /etc/banking/alerts.yaml\n\
    scrape_configs:\n- job_name: banking-pods\n  kubernetes_sd_configs:\n  - namespaces:\n\
    \      names:\n      - banking\n    role: pod\n  relabel_configs:\n  - action:\
    \ keep\n    regex: banking-core\n    source_labels:\n    - __meta_kubernetes_pod_label_part_of\n\
    \  - action: keep\n    regex: '8080'\n    source_labels:\n    - __meta_kubernetes_pod_container_port_number\n\
    \  - action: keep\n    regex: Running\n    source_labels:\n    - __meta_kubernetes_pod_phase\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n"
  alerts.yaml: "groups:\n- name: banking\n  rules:\n  - alert: BankingHighErrorRate\n\
    \    annotations:\n      summary: Banking 5xx rate exceeds 5%\n    expr: sum(rate(banking_http_requests_total{status=~\"\
    5..\"}[5m])) / clamp_min(sum(rate(banking_http_requests_total[5m])),\n      0.001)\
    \ > 0.05\n    for: 2m\n    labels:\n      severity: warning\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.3.0
        ports:
        - containerPort: 9090
          name: p9090
        volumeMounts:
        - name: config
          mountPath: /etc/banking
          readOnly: true
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        args:
        - --config.file=/etc/banking/prometheus.yaml
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
      securityContext:
        fsGroup: 65534
      serviceAccountName: banking-observer
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    name: p9090
---
